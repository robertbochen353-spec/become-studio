<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="成为工作室。了解正在开发的横版科幻剧情射击游戏《皮肉之下》。">
  <meta name="theme-color" content="#ffffff">
  <title>成为工作室</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./assets/studio-icon.png" type="image/png">
</head>
<body id="top">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="header">
    <div class="wrap header-inner">
      <a class="studio-name" href="#top">成为工作室</a>
      <nav aria-label="站内导航">
        <a href="#games">皮肉之下</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="wrap hero" aria-labelledby="wordmark">
      <h1 id="wordmark"><img src="./assets/become.png" alt="become" width="1698" height="375"></h1>
    </section>

    <section class="works" id="games" aria-labelledby="project-title">
      <div class="project">
        <img class="project-art" src="./assets/beneath-the-flesh.jpg" alt="暮色下的殖民星峡谷，峭壁上的基地闸门亮着橙色灯光" width="1672" height="941">
        <div class="wrap project-inner">
          <div class="project-copy">
            <p class="project-status">开发中</p>
            <h2 id="project-title">皮肉之下</h2>
            <p class="project-type">横版科幻剧情射击游戏</p>
            <p class="project-description">一场例行冬眠之后，帝国陆军中尉忒修斯在偏远殖民星醒来。他不知道自己睡了多久，也不知道这段时间里，基地发生了什么。</p>
            <a class="project-link" href="#gameplay">了解游戏</a>
          </div>
        </div>
      </div>

      <section class="wrap gameplay" id="gameplay" aria-labelledby="gameplay-title">
        <h3 id="gameplay-title">游戏内容</h3>
        <dl>
          <div>
            <dt>横版战斗</dt>
            <dd>随小队进入战区，利用掩体穿过火力封锁，完成任务后撤离。</dd>
          </div>
          <div>
            <dt>战役剧情</dt>
            <dd>在任务之间与队友交谈，调查沿途的设施和记录，逐步拼出忒修斯冬眠期间发生的事。</dd>
          </div>
        </dl>
      </section>
    </section>
  </main>

  <footer class="wrap footer">
    <span>成为工作室</span>
    <a href="#top">回到顶部</a>
  </footer>
</body>
</html>
